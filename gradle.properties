# Memory limits. This project is built inside WSL with about 5.9 GB of memory, shared with Docker.
# Left at their defaults, the Gradle and Kotlin helper processes grew to 4.7 GB together over a long
# session and used up all memory and swap (2026-11-26). So:
#  - the Gradle process has a bounded heap,
#  - the Kotlin compiler runs inside it (one helper process instead of two),
#  - the helper exits after 10 idle minutes instead of 3 hours.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
org.gradle.workers.max=3

org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
